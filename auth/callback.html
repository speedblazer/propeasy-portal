<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PropEasy - Confirming...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #1A3A5C; color: white; text-align: center; }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p { color: rgba(255,255,255,0.7); font-size: 16px; }
  </style>
</head>
<body>
  <div>
    <h1>Opening PropEasy...</h1>
    <p>You can close this window.</p>
  </div>
  <script>
    // Get the full URL hash and search params
    const hash = window.location.hash;
    const search = window.location.search;
    
    // Build the deep link with all params
    const deepLink = 'propeasy://auth/callback' + search + hash;
    
    // Redirect to app
    window.location.href = deepLink;
    
    // Fallback after 2 seconds
    setTimeout(() => {
      document.querySelector('p').textContent = 'If the app did not open, please open PropEasy manually.';
    }, 2000);
  </script>
</body>
</html>
